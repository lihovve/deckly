<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Иконка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span style="display: inline-flex; line-height: 0; color: #000000">
<sc-if value="{{is.trash}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M6 6l1 14h10l1-14"></path><path d="M10 10v7"></path><path d="M14 10v7"></path></svg></sc-if>
<sc-if value="{{is.pencil}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"></path><path d="M14 7l3 3"></path></svg></sc-if>
<sc-if value="{{is.gear}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="7"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></sc-if>
<sc-if value="{{is.floppy}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"></path><path d="M8 3v5h7V3"></path><path d="M8 21v-7h8v7"></path></svg></sc-if>
<sc-if value="{{is.arrowLeft}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4"></path><path d="M10 6l-6 6 6 6"></path></svg></sc-if>
<sc-if value="{{is.arrowRight}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16"></path><path d="M14 6l6 6-6 6"></path></svg></sc-if>
<sc-if value="{{is.plus}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16"></path><path d="M4 12h16"></path></svg></sc-if>
<sc-if value="{{is.minus}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16"></path></svg></sc-if>
<sc-if value="{{is.toEnd}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h13"></path><path d="M11 7l5 5-5 5"></path><path d="M20 5v14"></path></svg></sc-if>
<sc-if value="{{is.star}}" hint-placeholder-val="{{true}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="{{color}}" stroke="{{color}}" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.7-5 4.5 1.5 6.6L12 17l-6 3.4 1.5-6.6-5-4.5 6.6-.7z"></path></svg></sc-if>
<sc-if value="{{is.circle}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="{{color}}" stroke="none" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle></svg></sc-if>
<sc-if value="{{is.pen}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l6 8-6 12-6-12z"></path><path d="M12 10v5"></path><circle cx="12" cy="10" r="1"></circle></svg></sc-if>
<sc-if value="{{is.eraser}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 20l-5-5L14 4l7 7-9 9z"></path><path d="M9 9l7 7"></path><path d="M12 20h9"></path></svg></sc-if>
<sc-if value="{{is.undo}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-4"></path></svg></sc-if>
<sc-if value="{{is.stackNew}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h14v11H3z"></path><path d="M6 6h14v11"></path><path d="M10 12v5M7.5 14.5h5"></path></svg></sc-if>
<sc-if value="{{is.stackDone}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h14v11H3z"></path><path d="M6 6h14v11"></path><path d="M6.5 14.5l2.5 2.5 4.5-5"></path></svg></sc-if>
<sc-if value="{{is.chevronLeft}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4l-8 8 8 8"></path></svg></sc-if>
<sc-if value="{{is.exportFile}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M4 15v5h16v-5"></path></svg></sc-if>
<sc-if value="{{is.importFile}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M4 15v5h16v-5"></path></svg></sc-if>
<sc-if value="{{is.check}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
<sc-if value="{{is.more}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="{{color}}" stroke="none" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></sc-if>
<sc-if value="{{is.flip}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11a8 8 0 0 1 14.5-4.5L20 8"></path><path d="M20 3v5h-5"></path><path d="M20 13a8 8 0 0 1-14.5 4.5L4 16"></path><path d="M4 21v-5h5"></path></svg></sc-if>
<sc-if value="{{is.close}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></sc-if>
<sc-if value="{{is.chevronDown}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"></path></svg></sc-if>
<sc-if value="{{is.cornerBack}}" hint-placeholder-val="{{false}}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 10l-5 5 5 5"></path><path d="M4 15h10a6 6 0 0 0 6-6V4"></path></svg></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"glyph":{"editor":"enum","default":"star","options":["trash","pencil","gear","floppy","arrowLeft","arrowRight","plus","minus","toEnd","star","circle","pen","eraser","undo","stackNew","stackDone","chevronLeft","exportFile","importFile","check","more","flip","close","chevronDown","cornerBack"]},"tone":{"editor":"enum","default":"ink","options":["ink","muted","inverse"]},"size":{"editor":"text","default":"48"},"$preview":{"width":48,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    const g = this.props.glyph ?? 'star';
    const t = this.props.tone ?? 'ink';
    const names = ['trash','pencil','gear','floppy','arrowLeft','arrowRight','plus','minus','toEnd','star','circle','pen','eraser','undo','stackNew','stackDone','chevronLeft','exportFile','importFile','check','more','flip','close','chevronDown','cornerBack'];
    const is = {};
    names.forEach(function (n) { is[n] = g === n; });
    const color = t === 'muted' ? '#767676' : (t === 'inverse' ? '#FFFFFF' : '#000000');
    return { is: is, color: color, size: String(this.props.size ?? '48') };
  }
}
</script>
</body>
</html>
